name: Sonde
# Lancement manuel : interroge une archive et montre ce qu'elle expose (n'écrit rien sur main).
# Les fichiers de tools/probe/_out sont poussés seuls sur la branche probe-out.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script de tools/probe à lancer'
        required: true
        default: 'fetch_sketchfab.py'
      args:
        description: 'Arguments du script (facultatif)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Sonde
        run: python tools/probe/${{ github.event.inputs.script }} ${{ github.event.inputs.args }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          SKETCHFAB_TOKEN: '${{ secrets.SKETCHFAB_TOKEN }}'
        timeout-minutes: 25
        continue-on-error: true
      - name: Fichiers de la sonde vers la branche probe-out
        run: |
          [ -d tools/probe/_out ] || exit 0
          cd tools/probe/_out && git init -q -b probe-out && git add -A
          git -c user.name="probe" -c user.email="probe@users.noreply.github.com" commit -q -m "sortie de ${{ github.event.inputs.script }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
